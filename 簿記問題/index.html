<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>簿記練習問題</title>
</head>

<body>
  <!-- ① タイトル画面セクション -->
  <section id="title-section">
    <h1>簿記と彼女の戦い</h1>
    <button id="start-btn">ゲームを始める</button>
    <button id="how-to-play-btn">遊び方</button>
    <button id="localStorage-btn">続きから始める</button>
    <button id="chart" type="button">勘定科目一覧表</button>
  </section>

  <button id="menu-btn" type="button" aria-label="メニューを開く" aria-controls="chapterMenu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
  
  <div id="chapterMenu" class="hidden">
    <h2>チャプターを選択</h2>
    <div id="chapterList"></div>
    <button id="homeBtn" type="button">ホームに戻る</button>
    <button id="closeBtn">閉じる</button>
  </div>

  <div id="chartModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="chartTitle">
    <div id="chartContent">
      <h2 id="chartTitle">勘定科目一覧表</h2>
      <img src="img/勘定科目一覧.png" alt="勘定科目一覧表">
      <button id="chartCloseBtn" type="button">閉じる</button>
    </div>
  </div>

  <div id="window" class="hidden">
    <div id="storyControls" aria-label="ストーリー操作">
      <button id="speedBtn" type="button" aria-pressed="false">2倍速</button>
      <button id="pauseBtn" type="button" aria-pressed="false">一時停止</button>
      <button id="skipStoryBtn" type="button">問題へ進む</button>
    </div>
    <div id="name"></div>
    <div id="text"></div>
  </div>

  <section id="quizPanel" class="hidden" aria-labelledby="quizTitle">
    <h2 id="quizTitle">確認問題</h2>
    <p id="quizProgress"></p>
    <p id="quizQuestion"></p>
    <button id="quizHintButton" class="hidden" type="button">ヒント</button>
    <p id="quizHint" aria-live="polite"></p>
    <div id="quizChoices">
    </div>
    <p id="quizResult" aria-live="polite"></p>
    <button id="nextChapterBtn" class="hidden" type="button">チャプター3へ</button>
  </section>

  <section id="tutorialPanel" class="hidden" aria-labelledby="tutorialTitle">
    <h2 id="tutorialTitle">遊び方</h2>
    <div id="tutorialWindow">
      <div id="tutorialName"></div>
      <div id="tutorialText"></div>
    </div>
    <div id="tutorialChoices" class="hidden"></div>
    <p id="tutorialFeedback" aria-live="polite"></p>
    <p id="tutorialGuide">画面をクリックして進む</p>
    <button id="tutorialCloseBtn" type="button">ホームに戻る</button>
  </section>



  <script src="script.js"></script>
</body>

</html>
